<title>Fizyka · Pierwsze spotkanie z fizyką · Варвара</title>

<style>

  --t2:#059669;--t2b:#d1fae5;--t2d:#065f46;

  --t4:#dc2626;--t4b:#fee2e2;--t4d:#991b1b;
  --t5:#d97706;--t5b:#fef3c7;--t5d:#92400e;
  --t6:#0891b2;--t6b:#cffafe;--t6d:#164e63;
  --t7:#be185d;--t7b:#fce7f3;--t7d:#9d174d;
  --t8:#4f46e5;--t8b:#e0e7ff;--t8d:#3730a3;
  --t9:#0d9488;--t9b:#ccfbf1;--t9d:#115e59;
  --t10:#ea580c;--t10b:#ffedd5;--t10d:#9a3412;
  --t11:#64748b;--t11b:#f1f5f9;--t11d:#334155;
  --t12:#78716c;--t12b:#f5f5f4;--t12d:#44403c;
  --t13:#c026d3;--t13b:#fae8ff;--t13d:#86198f;
  --ok:#16a34a;--okb:#dcfce7;--err:#dc2626;--errb:#fee2e2;
  --r:14px;--rs:8px;--sh:0 2px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.page{max-width:720px;margin:0 auto;padding:20px 14px 80px}
.hero{text-align:center;padding:24px 0 20px;margin-bottom:20px;
  background:linear-gradient(135deg,#1d4ed8 0%,#7c3aed 50%,#059669 100%);
  border-radius:20px;color:white}
.hero .badge{display:inline-block;background:rgba(255,255,255,.2);
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 14px;border-radius:99px;margin-bottom:12px}
.hero h1{font-size:24px;font-weight:800;line-height:1.2;margin-bottom:6px}
.hero p{font-size:13px;opacity:.8}
.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}
.tcard{
  padding:12px 14px;border:2px solid var(--border);border-radius:var(--r);
  background:var(--card);cursor:pointer;transition:all .16s;box-shadow:var(--sh);
  display:flex;align-items:center;gap:10px;
}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.tcard .tc-ico{font-size:22px;flex-shrink:0}
.tcard .tc-body{min-width:0}
.tcard .tc-num{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tcard .tc-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
.tcard.active{border-width:2px;background:var(--c-bg,#dbeafe)}
.itabs{display:flex;gap:4px;background:var(--card);padding:4px;
  border-radius:var(--r);border:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.itab{flex-shrink:0;padding:7px 12px;border-radius:var(--rs);border:none;
  font-family:'Sora',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;background:transparent;color:var(--muted);transition:all .16s;white-space:nowrap}
.itab:hover{background:var(--bg)}
.itab.active{color:white}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:12px;box-shadow:var(--sh);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card-h{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tbox{padding:12px 13px;border-radius:var(--rs);border:1.5px solid}
.tbox h3{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.tbox ul{list-style:none;font-size:13px;line-height:2}
.tbox ul li::before{content:"• ";opacity:.4}
.formula{background:var(--c-bg,#dbeafe);border:1.5px solid var(--c,#2563eb);
  border-radius:var(--rs);padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:2}
.formula strong{color:var(--c-d,#1d4ed8);font-weight:800}
.math{font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.05);
  padding:2px 7px;border-radius:5px;font-size:13px}
.ex-list{display:flex;flex-direction:column;gap:10px}
.ex-item{background:var(--bg);border-radius:var(--rs);border:1px solid var(--border);overflow:hidden}
.ex-q{padding:10px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border)}
.ex-steps{padding:10px 14px}
.ex-step{display:flex;gap:8px;margin-bottom:6px;font-size:13px;line-height:1.6;align-items:flex-start}
.ex-step-n{width:20px;height:20px;border-radius:50%;background:var(--c,#2563eb);color:white;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ex-ans{background:var(--okb);color:#14532d;font-weight:700;font-size:13px;
  padding:7px 12px;border-radius:6px;margin-top:6px;display:inline-block}
.prog-bar{height:5px;background:var(--border);border-radius:99px;margin-bottom:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:var(--c,#2563eb);transition:width .4s}
.score-row{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.score-row b{color:var(--ink)}
.q-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
.q-text{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:6px}
.q-hint{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--rs);
  font-family:'Sora',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;background:var(--card);color:var(--ink);text-align:left;transition:all .14s}
.opt:hover:not(:disabled){border-color:var(--c,#2563eb);background:var(--c-bg,#dbeafe)}
.opt.ok{background:var(--okb);border-color:#86efac;color:#14532d;font-weight:700}
.opt.no{background:var(--errb);border-color:#fca5a5;color:#7f1d1d}
.feedback{margin-top:10px;padding:11px 14px;border-radius:var(--rs);font-size:13px;line-height:1.7;animation:up .18s ease}
.feedback.ok{background:var(--okb);color:#14532d;border:1px solid #86efac}
.feedback.no{background:var(--errb);color:#7f1d1d;border:1px solid #fca5a5}
.expl{margin-top:7px;background:white;border-radius:7px;padding:8px 12px;font-size:13px;color:#1e3a8a;line-height:1.7;border:1px solid #bfdbfe}
.nav-row{display:flex;justify-content:flex-end;margin-top:10px}
.btn{padding:9px 20px;border-radius:var(--rs);border:none;font-family:'Sora',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;transition:all .14s}
.btn-pri{background:var(--c,#2563eb);color:white}
.btn-pri:hover{filter:brightness(.9);transform:translateY(-1px)}
.btn-sec{background:var(--card);color:var(--ink);border:1.5px solid var(--border)}
.btn-sec:hover{background:var(--bg)}
.result{text-align:center;padding:10px 0 16px}
.result .big{font-size:54px;font-weight:800;color:var(--c,#2563eb);line-height:1}
.result .msg{font-size:15px;color:var(--muted);margin:8px 0 18px}
.result-btns{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.mk{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:var(--rs);padding:12px;margin-bottom:8px;text-align:left}
.mk-q{font-weight:700;font-size:13px;margin-bottom:4px}
.mk-w{font-size:12px;color:var(--err);margin-bottom:3px}
.mk-c{display:inline-block;background:var(--okb);color:#14532d;font-size:12px;font-weight:700;padding:2px 9px;border-radius:5px;margin-bottom:6px}
.mk-r{font-size:12px;color:#1e3a8a;background:#dbeafe;padding:7px 11px;border-radius:7px;line-height:1.7}
.fc-meta{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.flashcard{perspective:900px;width:100%;min-height:160px;cursor:pointer;margin-bottom:10px}
.fc-inner{position:relative;width:100%;min-height:160px;transform-style:preserve-3d;transition:transform .45s;border-radius:var(--r)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;min-height:160px;backface-visibility:hidden;
  border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:center;
  border:2px solid var(--border);box-shadow:var(--sh)}
.fc-front{background:white;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--c-bg,#dbeafe);border-color:var(--c,#2563eb)}
.fc-q{font-size:16px;font-weight:800;line-height:1.4;margin-bottom:7px}
.fc-tap{font-size:12px;color:var(--muted)}
.fc-a{font-size:14px;line-height:1.75}
.fc-a strong{color:var(--c-d,#1d4ed8)}
.fc-nav{display:flex;justify-content:space-between;align-items:center}
.fc-count{font-size:12px;color:var(--muted);font-weight:600}
@media(max-width:500px){
  .topic-grid{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr}
  .hero h1{font-size:19px}
  .result .big{font-size:40px}
}
</style>
<style>.ld-home{position:fixed;top:10px;left:10px;z-index:100;background:rgba(45,38,87,.92);color:#fff!important;text-decoration:none;font:600 13px/1 system-ui,sans-serif;padding:9px 13px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.2)}</style>

    {t:'t2',h:'Jak nie pomylić',items:['Śruba (ciało) jest zrobiona z żelaza (substancja)','Książka (ciało) jest zrobiona z papieru (substancja)','Jedno ciało może składać się z kilku substancji (rower: metal, guma, plastik)','Z jednej substancji można zrobić wiele ciał (żelazo: śruba, gwóźdź, nożyczki)','Uwaga: „woda” na liście to substancja, a „kropla wody” lub „jezioro” to już ciało']},
  ],
  formulas:`<strong>Ciało fizyczne</strong> = przedmiot lub organizm (rower, książka, śruba, drzewo, Ziemia).<br><strong>Substancja</strong> = materiał (żelazo, papier, drewno, plastelina, woda).<br>Pytanie kontrolne: „CO to jest?” → ciało. „Z CZEGO to jest?” → substancja.`,
},
examples:[
  {q:'Przyporządkuj słowa: żelazo, rower, książka, papier, plastelina, drzewo, drewno, Ziemia, śruba, woda.',steps:['Pytamy o każde słowo: czy to przedmiot/organizm (ciało), czy materiał (substancja)?','Ciała: rower, książka, drzewo, Ziemia, śruba','Substancje: żelazo, papier, plastelina, drewno, woda'],ans:'Ciała: rower, książka, drzewo, Ziemia, śruba. Substancje: żelazo, papier, plastelina, drewno, woda'},
  {q:'Śruba jest zrobiona z żelaza. Które słowo oznacza ciało, a które substancję?',steps:['Śruba to konkretny przedmiot','Żelazo to materiał, z którego ją zrobiono'],ans:'Ciało: śruba. Substancja: żelazo'},
  {q:'Z jakiej substancji składa się książka?',steps:['Książka to ciało fizyczne','Jej kartki są zrobione z papieru'],ans:'Z papieru (substancja)'},
],
flashcards:[
  {q:'Co to jest ciało fizyczne?',a:'Każdy <strong>przedmiot lub organizm żywy</strong>, który jest obiektem zainteresowania fizyki. Np. piłka, rower, drzewo, kangur, Ziemia.'},
  {q:'Co to jest substancja?',a:'<strong>Materiał, z którego zbudowane jest ciało fizyczne.</strong> Np. żelazo, drewno, papier, plastelina.'},
  {q:'Jak szybko odróżnić ciało od substancji?',a:'Zapytaj: „<strong>CO to jest?</strong>” (przedmiot → ciało) albo „<strong>Z CZEGO to jest?</strong>” (materiał → substancja).'},
  {q:'Czy drzewo to ciało fizyczne?',a:'<strong>Tak.</strong> Ciałem fizycznym jest też organizm żywy. A drewno, z którego jest zbudowane, to substancja.'},
  {q:'Podaj przykład jednej substancji i trzech ciał z niej zrobionych.',a:'Substancja: <strong>żelazo</strong>. Ciała: śruba, gwóźdź, nożyczki.'},
  {q:'Czy Ziemia to ciało fizyczne?',a:'<strong>Tak.</strong> Planeta Ziemia jest ciałem fizycznym (a skały czy woda, z których się składa, to substancje).'},
],
quiz:[
  {q:'Które słowo oznacza CIAŁO fizyczne?',opts:['Żelazo','Rower','Drewno','Papier'],a:1,hint:'Szukamy przedmiotu',expl:'<strong>Rower</strong> to przedmiot, czyli ciało fizyczne. Żelazo, drewno i papier to substancje.'},
  {q:'Które słowo oznacza SUBSTANCJĘ?',opts:['Śruba','Książka','Plastelina','Ziemia'],a:2,hint:'Szukamy materiału',expl:'<strong>Plastelina</strong> to materiał (substancja). Śruba, książka i Ziemia to ciała.'},
  {q:'Substancją jest:',opts:['Drzewo','Drewno','Rower','Książka'],a:1,hint:'Z czego zbudowane jest drzewo?',expl:'<strong>Drewno</strong> to substancja, a drzewo to ciało fizyczne (organizm).'},
  {q:'Ciałem fizycznym jest:',opts:['Papier','Woda','Żelazo','Śruba'],a:3,hint:'Konkretny przedmiot',expl:'<strong>Śruba</strong> to przedmiot. Papier, woda i żelazo to substancje.'},
  {q:'Książka jest zrobiona z papieru. Papier to:',opts:['Ciało fizyczne','Substancja','Zjawisko fizyczne','Wielkość fizyczna'],a:1,hint:'Z czego jest zrobiona książka?',expl:'<strong>Papier</strong> to materiał, więc substancja.'},
  {q:'Czy organizm żywy (np. kangur) może być ciałem fizycznym?',opts:['Tak, organizm żywy też jest ciałem fizycznym','Nie, ciała fizyczne to tylko przedmioty martwe','Tylko rośliny','Tylko jeśli się porusza szybko'],a:0,hint:'Wystarczy, że jest obiektem zainteresowania fizyki',expl:'Ciałem fizycznym jest <strong>każdy przedmiot lub organizm żywy</strong> badany przez fizykę.'},
  {q:'Z jednej substancji (żelaza) można wykonać wiele:',opts:['Zjawisk','Ciał fizycznych','Wielkości','Praw przyrody'],a:1,hint:'Śruba, gwóźdź, nożyczki',expl:'Z jednej substancji można zrobić wiele <strong>ciał fizycznych</strong>.'},
  {q:'Jakie pytanie pomaga rozpoznać SUBSTANCJĘ?',opts:['CO to jest?','Z CZEGO to jest zrobione?','Ile to waży?','Kiedy to powstało?'],a:1,hint:'Substancja to tworzywo',expl:'Substancję rozpoznasz pytaniem <strong>„Z czego to jest zrobione?”</strong>'},
]},

{id:'t3',ico:'🔭',num:'Lekcja 1 · Temat 3',name:'Obserwacja, doświadczenie i wielcy fizycy',
theory:{
  summary:'Fizyka poznaje świat dwoma sposobami: obserwuje zjawiska albo wywołuje je w doświadczeniu. Na tej podstawie odkryto prawa, bez których nie byłoby lasera, radia i lotów w kosmos.',
  blocks:[
    {t:'t3',h:'Obserwacja',items:['Obserwacja to oglądanie zjawiska BEZ wpływania na jego przebieg','Niektórych zjawisk nie da się wywołać ani powtórzyć: możemy je tylko obserwować','Przykłady: tornado, lawina, ruch planet, wygląd Księżyca na niebie','Notujemy to, co widzimy: opis, rysunek, zdjęcie, nagranie','Obserwacja pozwala zauważyć, jakie czynniki mogą mieć znaczenie']},
    {t:'t3',h:'Doświadczenie (eksperyment)',items:['Doświadczenie to zjawisko wywołane PRZEZ NAS w kontrolowanych warunkach','Można je powtórzyć i zmienić jeden czynnik naraz','Przykład: upuszczanie ciał z tej samej wysokości i porównywanie czasu spadania','Pozwala wskazać, które czynniki naprawdę wpływają na zjawisko','Z obserwacji i doświadczeń formułuje się prawa fizyczne']},
    {t:'t3',h:'Obserwacja czy doświadczenie? (zadanie z podręcznika)',items:['A. Nagranie lawiny wpadającej do jeziora i opis skutków = OBSERWACJA','B. Upuszczenie z tej samej wysokości piłki tenisowej i kartki papieru, porównanie czasu spadania = DOŚWIADCZENIE','C. Wkładanie różnych przedmiotów do miski z wodą i sprawdzanie, co pływa, a co tonie = DOŚWIADCZENIE','D. Rysowanie wyglądu Księżyca w zeszycie w pogodne noce = OBSERWACJA','Reguła: sami coś robimy i zmieniamy warunki → doświadczenie; tylko patrzymy → obserwacja']},
    {t:'t3',h:'Co zawdzięczamy fizykom',items:['Isaac Newton (1643–1727): prawo powszechnego ciążenia i zasady dynamiki → loty na Księżyc, planowanie lotów, satelity','Albert Einstein (1879–1955): badania nad światłem i materią → laser (medycyna, odczyt danych, pomiar odległości)','James Clerk Maxwell (1831–1879): przewidział istnienie fal radiowych','Heinrich Hertz (1857–1894): w 1886 r. pierwsza próba nadania i odebrania fal radiowych','Thomas Newcomen i James Watt: silniki parowe (XVIII w.); dziś też silniki spalinowe, elektryczne i odrzutowe']},
  ],
  formulas:`<strong>Obserwacja</strong> = tylko patrzymy, nie wpływamy na zjawisko (lawina, Księżyc).<br><strong>Doświadczenie</strong> = sami wywołujemy zjawisko i możemy je powtarzać (upuszczanie piłki i kartki).<br><strong>Newton</strong> → ciążenie, <strong>Einstein</strong> → laser, <strong>Maxwell</strong> → przewidział fale radiowe, <strong>Hertz</strong> → pierwsze nadawanie fal (1886), <strong>Watt i Newcomen</strong> → silnik parowy.`,
},
examples:[
  {q:'Nagrywasz lawinę spadającą do jeziora i opisujesz jej skutki. To obserwacja czy doświadczenie?',steps:['Lawiny nie wywołujemy sami','Tylko patrzymy i notujemy','Brak wpływu na przebieg zjawiska'],ans:'Obserwacja'},
  {q:'Upuszczasz z tej samej wysokości piłkę tenisową i kartkę papieru i porównujesz czas spadania. Co to jest?',steps:['Sami wywołujemy zjawisko','Kontrolujemy warunki (ta sama wysokość)','Możemy to powtórzyć'],ans:'Doświadczenie'},
  {q:'Który uczony przyczynił się do skonstruowania lasera?',steps:['Laser powstał dzięki badaniom nad oddziaływaniem światła z materią','Prowadził je Albert Einstein'],ans:'Albert Einstein'},
  {q:'Uzupełnij: Podróż na Księżyc nie byłaby możliwa bez prac Isaaca ..., który sformułował prawo ...',steps:['Chodzi o angielskiego uczonego (1643–1727)','Jego odkrycie pomogło precyzyjnie zaplanować lot'],ans:'Isaaca Newtona; prawo powszechnego ciążenia'},
],
flashcards:[
  {q:'Czym różni się obserwacja od doświadczenia?',a:'Przy <strong>obserwacji</strong> tylko patrzymy (nie wpływamy na zjawisko). W <strong>doświadczeniu</strong> sami wywołujemy zjawisko w kontrolowanych warunkach i możemy je powtarzać.'},
  {q:'Podaj przykład zjawiska, które możemy tylko obserwować.',a:'<strong>Tornado, lawina, ruch planet, fazy Księżyca.</strong> Nie da się ich powtórzyć w laboratorium.'},
  {q:'Co odkrył Isaac Newton?',a:'<strong>Prawo powszechnego ciążenia i zasady dynamiki.</strong> Dzięki nim możliwe są loty na Księżyc i użycie satelitów.'},
  {q:'Czyim odkryciom zawdzięczamy laser?',a:'Badania <strong>Alberta Einsteina</strong> nad oddziaływaniem światła z materią doprowadziły do konstrukcji lasera.'},
  {q:'Kto przewidział istnienie fal radiowych, a kto je pierwszy nadał i odebrał?',a:'Istnienie przewidział <strong>James Clerk Maxwell</strong>. Pierwszą próbę nadania i odbioru wykonał <strong>Heinrich Hertz</strong> w 1886 r.'},
  {q:'Kto stworzył pierwsze silniki parowe?',a:'W XVIII w. dzięki doświadczeniom <strong>Thomasa Newcomena i Jamesa Watta</strong>.'},
  {q:'Do czego służą fale radiowe?',a:'Do <strong>komunikacji na duże odległości</strong> (także z załogą statku kosmicznego) i do badania Wszechświata.'},
],
quiz:[
  {q:'Rejestrowanie lawiny wpadającej do jeziora to:',opts:['Doświadczenie','Obserwacja','Pomiar masy','Prawo fizyczne'],a:1,hint:'Czy sami wywołujemy lawinę?',expl:'Lawiny nie wywołujemy, tylko ją opisujemy: to <strong>obserwacja</strong>.'},
  {q:'Upuszczanie z tej samej wysokości piłki tenisowej i kartki papieru to:',opts:['Obserwacja','Doświadczenie','Zjawisko atmosferyczne','Substancja'],a:1,hint:'Sami wywołujemy i kontrolujemy warunki',expl:'To <strong>doświadczenie</strong>: sami wywołujemy zjawisko w kontrolowanych warunkach.'},
  {q:'Rysowanie wyglądu Księżyca w pogodne noce to:',opts:['Doświadczenie','Obserwacja','Pomiar','Odkrycie prawa'],a:1,hint:'Tylko patrzymy na niebo',expl:'Na Księżyc nie wpływamy, więc to <strong>obserwacja</strong>.'},
  {q:'Wkładanie różnych przedmiotów do wody i sprawdzanie, co pływa, to:',opts:['Obserwacja','Doświadczenie','Prawo przyrody','Wielkość fizyczna'],a:1,hint:'Sami wykonujemy próbę',expl:'Sami wywołujemy zjawisko i możemy je powtarzać: to <strong>doświadczenie</strong>.'},
  {q:'Kto sformułował prawo powszechnego ciążenia?',opts:['Albert Einstein','Heinrich Hertz','Isaac Newton','James Watt'],a:2,hint:'Dzięki niemu planuje się loty na Księżyc',expl:'Prawo powszechnego ciążenia sformułował <strong>Isaac Newton</strong>.'},
  {q:'Badania którego uczonego przyczyniły się do powstania lasera?',opts:['Isaaca Newtona','Alberta Einsteina','Jamesa Watta','Heinricha Hertza'],a:1,hint:'Światło i materia',expl:'Do lasera przyczyniły się badania <strong>Alberta Einsteina</strong>.'},
  {q:'Kto przewidział istnienie fal radiowych?',opts:['James Clerk Maxwell','Thomas Newcomen','Isaac Newton','Albert Einstein'],a:0,hint:'Szkocki uczony (1831–1879)',expl:'Istnienie fal radiowych przewidział <strong>James Clerk Maxwell</strong>, a Hertz próbował je nadać w 1886 r.'},
  {q:'Pierwsze silniki parowe powstały w:',opts:['XVIII wieku','XX wieku','XV wieku','XXI wieku'],a:0,hint:'Newcomen i Watt',expl:'Pierwsze silniki parowe skonstruowano w <strong>XVIII wieku</strong>.'},
]},

{id:'t4',ico:'📏',num:'Lekcja 2 · Temat 4',name:'Wielkości fizyczne i pomiar',
theory:{
  summary:'Wielkość fizyczna to cecha, którą można zmierzyć i zapisać jako liczbę z jednostką. Pomiar to porównanie z wzorcem. (Фізична величина — те, що можна виміряти.)',
  blocks:[
    {t:'t4',h:'Co jest wielkością fizyczną',items:['Wielkość fizyczna to cecha ciała lub zjawiska wyrażona liczbą i jednostką','Przykłady: długość, masa, temperatura, czas, objętość, wysokość','NIE są wielkościami fizycznymi: zapach, smak, barwa, a także samo słowo „substancja”','Wielkości mierzymy, więc musi istnieć jednostka i przyrząd','Pomiary pozwalają opisać zjawisko dokładnie, nie „na oko”']},
    {t:'t4',h:'Pomiar',items:['Pomiar jest porównaniem wartości mierzonej wielkości z jej wzorcem','Wzorzec to przyjęta jednostka (lub jej kopia)','Przykład: długość porównujemy z wzorcem metra (linijka, taśma)','Wynik pomiaru to ZAWSZE liczba z jednostką','Sama liczba bez jednostki nie ma sensu fizycznego']},
    {t:'t4',h:'Jak zapisujemy wartość wielkości',items:['Schemat: oznaczenie wielkości = wartość jednostka','Przykłady: T = 20 °C (temperatura), m = 50 kg (masa), l = 1,2 m (długość)','Oznaczenia: t – czas (s), m – masa (kg), l – długość (m), T – temperatura','Ten sam symbol bywa używany dla różnych rzeczy: t (czas) i T (temperatura), m jako masa i m jako metr','W druku symbole wielkości piszemy kursywą, a jednostki zwykłym pismem']},
    {t:'t4',h:'Pułapki i ciekawostki',items:['„Kilo pomarańczy” nie jest poprawne w fizyce: „kilo” to przedrostek, nie jednostka. Poprawnie: masa pomarańczy wynosi 1 kg','Dawniej mierzono łokciem, stopą, krokiem (mila = 1000 kroków); jednostki różniły się w zależności od kraju','Metr (Francja, XVIII w.): jedna dziesięciomilionowa część odległości od bieguna północnego do równika','Wzorzec kilograma (walec z platyny i irydu, 1 kg) leży w Sèvres pod Paryżem','Cal (inch) nie należy do SI: 1 cal = 2,54 cm, używany np. dla przekątnej ekranu']},
  ],
  formulas:`<strong>Wielkość fizyczna</strong> = da się zmierzyć (liczba + jednostka): długość, masa, czas, temperatura, objętość.<br><strong>Nie</strong> są wielkościami: zapach, smak, barwa.<br><strong>Pomiar</strong> = porównanie z wzorcem.<br><strong>Zapis:</strong> m = 50 kg → m (oznaczenie), 50 (wartość), kg (jednostka).`,
},
examples:[
  {q:'Z listy wybierz wielkości fizyczne: objętość, zapach, temperatura, substancja, masa, smak, barwa, wysokość.',steps:['Sprawdzamy: czy da się to zmierzyć i podać liczbą z jednostką?','Objętość, temperatura, masa, wysokość: tak','Zapach, smak, barwa, substancja: nie'],ans:'Objętość, temperatura, masa, wysokość'},
  {q:'Rozbierz zapis l = 3,5 cm na części.',steps:['l to oznaczenie wielkości (długość)','3,5 to wartość','cm to jednostka (przedrostek c- i metr)'],ans:'l – oznaczenie, 3,5 – wartość, cm – jednostka (c – przedrostek)'},
  {q:'Wyjaśnij, dlaczego „kilo pomarańczy” nie jest poprawnym zapisem w fizyce.',steps:['„Kilo” to tylko przedrostek oznaczający 1000','Brak nazwy jednostki (gram)','Poprawnie: masa pomarańczy m = 1 kg'],ans:'Bo „kilo” jest przedrostkiem, a nie jednostką; poprawnie: 1 kg'},
  {q:'Przekątna telewizora to 32 cale. Ile to centymetrów?',steps:['1 cal = 2,54 cm','32 · 2,54 = 81,28'],ans:'81,28 cm'},
],
flashcards:[
  {q:'Co to jest wielkość fizyczna?',a:'Cecha ciała lub zjawiska, którą można <strong>zmierzyć</strong> i wyrazić <strong>liczbą z jednostką</strong>. Np. długość, masa, czas, temperatura.'},
  {q:'Co to jest pomiar?',a:'<strong>Porównanie wartości mierzonej wielkości z jej wzorcem.</strong>'},
  {q:'Które cechy NIE są wielkościami fizycznymi?',a:'<strong>Zapach, smak, barwa</strong> (oraz pojęcie „substancja”). Nie wyrażamy ich liczbą z jednostką.'},
  {q:'Jak zapisujemy wartość wielkości fizycznej?',a:'<strong>oznaczenie = wartość jednostka</strong>, np. <strong>m = 50 kg</strong>, T = 20 °C, l = 1,2 m.'},
  {q:'Dlaczego „kilo pomarańczy” jest niepoprawne?',a:'<strong>„Kilo” to przedrostek</strong> (×1000), nie jednostka. Poprawnie podajemy masę w kg: m = 1 kg.'},
  {q:'Ile centymetrów ma 1 cal?',a:'<strong>1 cal = 2,54 cm.</strong> Cal to jednostka pozaukładowa, używana np. dla przekątnej ekranów.'},
  {q:'Skąd pochodzi metr?',a:'W XVIII w. we Francji zdefiniowano go jako <strong>jedną dziesięciomilionową część odległości od bieguna północnego do równika</strong>.'},
],
quiz:[
  {q:'Która z cech jest wielkością fizyczną?',opts:['Zapach','Masa','Smak','Barwa'],a:1,hint:'Da się zmierzyć i podać z jednostką',expl:'<strong>Masa</strong> jest wielkością fizyczną (kg). Zapach, smak i barwa nie mają jednostek.'},
  {q:'Które z podanych NIE jest wielkością fizyczną?',opts:['Temperatura','Długość','Czas','Smak'],a:3,hint:'Nie da się go zmierzyć miarą',expl:'<strong>Smak</strong> nie jest wielkością fizyczną.'},
  {q:'Pomiar to:',opts:['Zgadywanie wartości','Porównanie mierzonej wielkości z jej wzorcem','Zapis wzoru','Opis zjawiska słowami'],a:1,hint:'Definicja z podręcznika',expl:'Pomiar jest <strong>porównaniem wartości mierzonej wielkości z jej wzorcem</strong>.'},
  {q:'W zapisie m = 50 kg WARTOŚCIĄ wielkości jest:',opts:['m','50','kg','m = 50'],a:1,hint:'Liczba bez jednostki',expl:'Wartość to <strong>50</strong>, jednostka to kg, a m to oznaczenie masy.'},
  {q:'W zapisie l = 3,5 cm JEDNOSTKĄ jest:',opts:['l','3,5','cm','c'],a:2,hint:'Przedrostek + metr',expl:'Jednostką jest <strong>cm</strong> (centymetr); „c” to tylko przedrostek.'},
  {q:'Dlaczego zwrot „kilo pomarańczy” nie jest poprawny w fizyce?',opts:['Bo pomarańcze nie mają masy','Bo „kilo” to przedrostek, a nie jednostka','Bo kilogram nie istnieje','Bo trzeba podać temperaturę'],a:1,hint:'Kilo = ×1000',expl:'„Kilo” jest <strong>przedrostkiem</strong>. Poprawnie: masa pomarańczy wynosi 1 kg.'},
  {q:'Ile centymetrów ma 1 cal?',opts:['1 cm','2,54 cm','10 cm','25,4 cm'],a:1,hint:'Jednostka pozaukładowa',expl:'<strong>1 cal = 2,54 cm</strong>.'},
  {q:'Wartość wielkości fizycznej podajemy zawsze:',opts:['Bez jednostki','Z jednostką','Tylko słownie','Tylko w minutach'],a:1,hint:'Liczba + jednostka',expl:'Wartość wielkości fizycznej zawsze podajemy <strong>wraz z jednostką</strong>.'},
]},

{id:'t5',ico:'🌍',num:'Lekcja 2 · Temat 5',name:'Układ SI i jednostki podstawowe',
theory:{
  summary:'SI to wspólny, międzynarodowy układ jednostek. Dzięki niemu naukowcy i producenci na całym świecie mierzą tak samo. (SI — міжнародна система одиниць.)',
  blocks:[
    {t:'t5',h:'Czym jest układ SI',items:['SI (Système International d’Unités) to Międzynarodowy Układ Jednostek','Przyjęto go, żeby wyniki pomiarów były takie same i zrozumiałe w każdym kraju','Ma 7 jednostek podstawowych; pozostałe tworzy się z nich (jednostki pochodne)','W szkole najczęściej używamy: metr, kilogram, sekunda, kelwin','Jednostki spoza SI (cal, mila, godzina, doba, litr) są dozwolone, ale trzeba umieć je przeliczyć']},

{id:'t6',ico:'🔄',num:'Lekcja 2 · Temat 6',name:'Przedrostki i zamiana jednostek',
theory:{
  summary:'Przedrostki skracają zapis bardzo dużych i bardzo małych liczb. Najważniejsze: kilo (×1000), centy (÷100), mili (÷1000). Zamiana jednostek to najczęstsze zadanie na kartkówce.',
  blocks:[

    {t:'t6',h:'Jak zamieniać (szybka metoda)',items:['Z większej jednostki na mniejszą → MNOŻYMY (liczba rośnie)','Z mniejszej jednostki na większą → DZIELIMY (liczba maleje)','Najpierw ustal: ile małych mieści się w dużej (np. 1 m = 100 cm)','Sprawdź sensowność: 2 m = 200 cm (dużo małych), a nie 0,02 cm','Wynik zawsze zapisz z nową jednostką']},
    {t:'t6',h:'Najważniejsze zamiany',items:['Długość: 1 km = 1000 m; 1 m = 10 dm = 100 cm = 1000 mm','Masa: 1 t = 1000 kg; 1 kg = 100 dag = 1000 g; 1 g = 1000 mg','Czas: 1 h = 60 min; 1 min = 60 s','Przykłady: 50 cm = 0,5 m; 20 dm = 2 m; 0,1 km = 100 m','Przykłady: 50 dag = 0,5 kg; 1200 g = 1,2 kg; 4,5 t = 4500 kg']},
    {t:'t6',h:'Typowe błędy',items:['Mylenie centy (c) z mili (m): 1 cm = 10 mm, ale 1 m = 1000 mm','Dzielenie zamiast mnożenia (i odwrotnie)','Zapominanie o tym, że 1 h = 60 min, a nie 100 min','Zamiana 1 dag na gramy: to 10 g, a nie 100 g','Zostawienie wyniku bez jednostki']},

  formulas:`<strong>Mnożymy:</strong> duża → mała (m → cm: ×100).<br><strong>Dzielimy:</strong> mała → duża (cm → m: ÷100).<br><span class="math">1 km = 1000 m</span> · <span class="math">1 m = 100 cm = 1000 mm</span><br><span class="math">1 t = 1000 kg</span> · <span class="math">1 kg = 1000 g</span> · <span class="math">1 dag = 10 g</span><br><span class="math">1 h = 60 min = 3600 s</span>`,

{id:'t7',ico:'🎯',num:'Lekcja 3 · Temat 7',name:'Niepewność pomiarowa i dokładność',
theory:{
  summary:'Żaden pomiar nie jest idealnie dokładny. Wynik zależy od przyrządu, od nas i od warunków. Dlatego mówimy o niepewności pomiaru.',
  blocks:[
    {t:'t7',h:'Dlaczego pomiar nie jest dokładny',items:['Przyrząd ma ograniczoną dokładność (podziałka linijki co 1 mm)','Człowiek może źle ustawić przyrząd lub źle odczytać wynik','Warunki mogą się zmieniać (temperatura, drgania)','Zawsze mierzymy z jakąś niepewnością, nigdy „idealnie”','Wynik pomiaru to przybliżenie wartości prawdziwej']},
    {t:'t7',h:'Dokładność przyrządu',items:['Najmniejsza działka (podziałka) skali określa dokładność przyrządu','Linijka z podziałką 1 mm → dokładność 1 mm','Im mniejsza podziałka, tym dokładniejszy pomiar','Wynik zapisujemy nie dokładniej niż pozwala przyrząd','Do małych elementów wybieramy przyrząd o małej podziałce (np. suwmiarka)']},
    {t:'t7',h:'Jak mierzyć poprawnie',items:['Wybierz przyrząd odpowiedni do mierzonej wielkości i zakresu','Zero skali ustaw na początku mierzonego obiektu','Patrz prostopadle na skalę (nie z boku), by uniknąć błędu paralaksy','Odczytaj wynik z dokładnością do najmniejszej działki','Zapisz wynik z jednostką']},
    {t:'t7',h:'Co jeśli kreska wypada między działkami',items:['Wynik zaokrąglamy do najbliższej działki lub zapisujemy w połowie podziałki, jeśli przyrząd na to pozwala','Nie podajemy wyniku dokładniejszego niż skala (np. 12,34 cm z linijki mm)','Zawsze zapisujemy dokładnie to, co odczytaliśmy','Przy powtarzaniu pomiaru wyniki mogą się lekko różnić: to normalne','Różnice między pomiarami pokazują niepewność']},
  ],
  formulas:`<strong>Dokładność przyrządu</strong> = najmniejsza działka skali.<br>Linijka z mm: dokładność <span class="math">1 mm = 0,1 cm</span>.<br><strong>Pomiar zawsze ma niepewność</strong> i nie zapisujemy go dokładniej niż pozwala przyrząd.<br>Patrz na skalę <strong>prostopadle</strong>.`,
},
examples:[
  {q:'Linijka ma podziałkę co 1 mm. Jaka jest jej dokładność?',steps:['Dokładność = najmniejsza działka','Najmniejsza działka to 1 mm'],ans:'1 mm (0,1 cm)'},
  {q:'Zmierzyłaś zeszyt linijką z podziałką mm. Który zapis jest poprawny: 21 cm, 21,0 cm, 21,03 cm?',steps:['Dokładność to 1 mm = 0,1 cm','Wynik zapisujemy z jednym miejscem po przecinku','21,03 cm jest zbyt dokładne'],ans:'21,0 cm'},
  {q:'Jak ustawić oko przy odczycie skali?',steps:['Patrzenie z boku zmienia odczyt (paralaksa)','Należy patrzeć prostopadle do skali'],ans:'Prostopadle do skali'},
],
flashcards:[

  {q:'Pierwszy krok przy pomiarze linijką to:',opts:['Zapisać wynik','Ustawić zero skali na początku obiektu','Zmierzyć dwa razy','Obliczyć średnią'],a:1,hint:'Punkt startu',expl:'Zero skali ustawiamy <strong>na początku mierzonego obiektu</strong>.'},

{id:'t8',ico:'➗',num:'Lekcja 3 · Temat 8',name:'Pomiar wielokrotny i średnia',
theory:{
  summary:'Aby wynik był wiarygodniejszy, mierzymy kilka razy i liczymy średnią arytmetyczną. Wynik końcowy zaokrąglamy do dokładności przyrządu.',
  blocks:[
    {t:'t8',h:'Dlaczego mierzymy wielokrotnie',items:['Pojedynczy pomiar może zawierać przypadkowy błąd','Wiele pomiarów zmniejsza wpływ błędów przypadkowych','Wyniki zapisujemy w tabeli','Obliczamy średnią arytmetyczną jako wynik końcowy','Zazwyczaj wykonuje się co najmniej 3 pomiary (lepiej 5–10)']},
    {t:'t8',h:'Średnia arytmetyczna',items:['Dodajemy wszystkie wyniki pomiarów','Dzielimy sumę przez liczbę pomiarów','Wzór: x̄ = (x₁ + x₂ + … + xₙ) / n','Przykład: 20, 22, 21 → suma 63, n = 3, średnia 21','Średnia leży między najmniejszym a największym wynikiem']},
    {t:'t8',h:'Jak zaokrąglić wynik',items:['Średnią zaokrąglamy do dokładności przyrządu (zwykle tyle miejsc, ile mają pomiary)','Pomiary w cm z jednym miejscem po przecinku → wynik też z jednym miejscem','Zasada: cyfra ≥ 5 → zaokrąglamy w górę, cyfra ≤ 4 → w dół','Przykład: 46,8857 cm → 46,9 cm','Przykład: 21,0857 cm → 21,1 cm']},
    {t:'t8',h:'Przykłady z podręcznika',items:['Pomiary: 46,7; 47,3; 46,8; 47,0; 46,8; 47,2; 46,4 cm → suma 328,2; 328,2 : 7 ≈ 46,9 cm','Pomiary: 144,2 cm sześć razy i raz 144,3 cm → średnia ≈ 144,2 cm','Mierzymy tę samą rzecz kilka razy, nawet jeśli wyniki są podobne','Wynik końcowy zapisujemy z jednostką','Jeśli jeden wynik jest bardzo odległy od reszty, najpierw sprawdzamy, czy nie było pomyłki']},
  ],
  formulas:`<strong>Średnia arytmetyczna:</strong> <span class="math">x̄ = (x₁ + x₂ + … + xₙ) : n</span><br>Przykład: (46,7 + 47,3 + 46,8 + 47,0 + 46,8 + 47,2 + 46,4) : 7 = 328,2 : 7 ≈ <strong>46,9 cm</strong><br>Wynik zaokrąglamy do <strong>dokładności przyrządu</strong>.`,
},
examples:[
  {q:'Trzy pomiary długości: 20 cm, 22 cm, 21 cm. Oblicz wynik.',steps:['Suma: 20 + 22 + 21 = 63','Liczba pomiarów: 3','63 : 3 = 21'],ans:'21 cm'},
  {q:'Pomiary: 46,7; 47,3; 46,8; 47,0; 46,8; 47,2; 46,4 (cm). Oblicz średnią.',steps:['Suma = 328,2','n = 7','328,2 : 7 = 46,8857…','Zaokrąglamy do 0,1 cm'],ans:'46,9 cm'},

// ══════════════════ STATE
let ct=TOPICS[0],tab='theory',fcI=0,fcF=false,qi=0,sel=null,score=0,mistakes=[],qList=[];

function applyColors(id){
  const c=C[id];
  document.documentElement.style.setProperty('--c',c.c);
  document.documentElement.style.setProperty('--c-bg',c.bg);
  document.documentElement.style.setProperty('--c-d',c.d);
}

function setTopic(id){
  ct=TOPICS.find(t=>t.id===id);
  tab='theory';fcI=0;fcF=false;
  qi=0;sel=null;score=0;mistakes=[];
  qList=[...ct.quiz].sort(()=>Math.random()-.5);
  applyColors(id);
  renderTopics();renderITabs();render();
}

function setTab(id){
  tab=id;fcI=0;fcF=false;
  if(id==='quiz'){qi=0;sel=null;score=0;mistakes=[];qList=[...ct.quiz].sort(()=>Math.random()-.5);}
  renderITabs();render();
}

function renderTopics(){
  document.getElementById('topic-grid').innerHTML=TOPICS.map(t=>`
    <button class="tcard${t.id===ct.id?' active':''}" onclick="setTopic('${t.id}')"
      style="${t.id===ct.id?`border-color:${C[t.id].c};background:${C[t.id].bg}`:''}">
      <div class="tc-ico">${t.ico}</div>
      <div class="tc-body">
        <div class="tc-num">${t.num}</div>
        <div class="tc-name">${t.name}</div>
      </div>
    </button>`).join('');
}

const TABS=[
  {id:'theory',l:'📖 Teoria'},
  {id:'formulas',l:'📋 Kluczowe fakty'},
  {id:'examples',l:'✏️ Przykłady'},
  {id:'flash',l:'🃏 Fiszki'},
  {id:'quiz',l:'🧮 Test'},
];

function renderITabs(){
  document.getElementById('itabs').innerHTML=TABS.map(t=>`
    <button class="itab${tab===t.id?' active':''}"
      style="${tab===t.id?`background:${C[ct.id].c}`:''}
      " onclick="setTab('${t.id}')">${t.l}</button>`).join('');
}

function renderTheory(){
  const th=ct.theory;
  return `<div class="card">
    <div class="card-h">${ct.ico} ${ct.name}</div>
    <p style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.6">${th.summary}</p>
    <div class="tgrid">${th.blocks.map(b=>`
      <div class="tbox" style="background:${C[b.t].bg};border-color:${C[b.t].c}40">
        <h3 style="color:${C[b.t].d}">${b.h}</h3>
        <ul style="color:${C[b.t].d}">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>`).join('')}
    </div>
  </div>
  <div style="margin-top:4px"><button class="btn btn-pri" onclick="setTab('formulas')">📋 Kluczowe fakty →</button></div>`;
}

function renderFormulas(){
  return `<div class="card">
    <div class="card-h">📋 Kluczowe fakty — ${ct.name}</div>
    <div class="formula">${ct.theory.formulas}</div>
    <div style="margin-top:4px"><button class="btn btn-pri" onclick="setTab('examples')">✏️ Przykłady →</button></div>
  </div>`;
}

function renderExamples(){
  return `<div class="card">
    <div class="card-h">✏️ Przykłady krok po kroku</div>
    <div class="ex-list">${ct.examples.map(e=>`
      <div class="ex-item">
        <div class="ex-q">${e.q}</div>
        <div class="ex-steps">
          ${e.steps.map((s,i)=>`
            <div class="ex-step">
              <div class="ex-step-n" style="background:${C[ct.id].c}">${i+1}</div>
              <div>${s}</div>
            </div>`).join('')}
          <div class="ex-ans">✅ Odpowiedź: ${e.ans}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderFlash(){
  const cards=ct.flashcards;
  const c=cards[fcI];
  return `<div class="card">
    <div class="card-h">🃏 Fiszki — ${ct.name}</div>
    <div class="fc-meta">Kliknij kartę · ${fcI+1} z ${cards.length}</div>
    <div class="flashcard${fcF?' flipped':''}" onclick="flipCard()">
      <div class="fc-inner">
        <div class="fc-front"><div class="fc-q">${c.q}</div><div class="fc-tap">👆 Kliknij, by zobaczyć odpowiedź</div></div>
        <div class="fc-back" style="background:${C[ct.id].bg};border-color:${C[ct.id].c}">
          <div class="fc-a" style="--c-d:${C[ct.id].d}">${c.a}</div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="btn btn-sec" onclick="fcNav(-1)" ${fcI===0?'disabled':''}>← Poprzednia</button>
      <span class="fc-count">${fcI+1} / ${cards.length}</span>
      <button class="btn btn-pri" onclick="fcNav(1)" ${fcI===cards.length-1?'disabled':''}>Następna →</button>
    </div>
  </div>`;
}

function flipCard(){fcF=!fcF;render();}
function fcNav(d){fcI+=d;fcF=false;render();}

function renderQuiz(){
  if(qi>=qList.length)return renderResult();
  const q=qList[qi];
  const total=qList.length;
  const pct=Math.round((qi/total)*100);
  const optsHTML=q.opts.map((o,i)=>{
    let cls='opt';
    if(sel!==null){if(i===q.a)cls+=' ok';else if(i===sel&&sel!==q.a)cls+=' no';}
    return `<button class="${cls}" onclick="choose(${i})" ${sel!==null?'disabled':''}>${o}</button>`;
  }).join('');
  let fb='';
  if(sel!==null){
    fb=sel===q.a
      ?`<div class="feedback ok">✓ Правильно! <div class="expl">${q.expl}</div></div>`
      :`<div class="feedback no">✗ Правильна: <strong>${q.opts[q.a]}</strong><div class="expl">${q.expl}</div></div>`;
  }
  return `
  <div class="prog-bar"><div class="prog-fill" style="background:${C[ct.id].c};width:${pct}%"></div></div>
  <div class="score-row">
    <span>Pytanie <b>${qi+1}/${total}</b></span>
    <span>✅ <b style="color:var(--ok)">${score}</b></span>
    <span>❌ <b style="color:var(--err)">${mistakes.length}</b></span>
  </div>
  <div class="card">
    <div class="q-label">Pytanie ${qi+1}</div>
    <div class="q-text">${q.q}</div>
    <div class="q-hint">💡 ${q.hint}</div>
    <div class="opts">${optsHTML}</div>
    ${fb}
  </div>
  <div class="nav-row">${sel!==null?`<button class="btn btn-pri" onclick="nextQ()">Dalej →</button>`:''}</div>`;
}

function renderResult(){
  const total=qList.length;
  const pct=Math.round((score/total)*100);
  const emoji=pct>=80?'🎉':pct>=60?'👍':'📚';
  const stars=pct>=100?'⭐⭐⭐':pct>=80?'⭐⭐':pct>=60?'⭐':'';
  const msg=pct>=80?'Warwara — gotowa na kontrolną!':pct>=60?'Dobrze! Powtórz błędy.':'Wróć do teorii i kluczowych faktów.';
  const mHTML=mistakes.length?`
    <div style="margin-top:16px;text-align:left">
      <div style="font-size:14px;font-weight:800;margin-bottom:10px">Błędy:</div>
      ${mistakes.map(m=>`
        <div class="mk">
          <div class="mk-q">${m.q}</div>
          <div class="mk-w">Ти відповіла: <b>${m.wrong}</b></div>
          <div class="mk-c">✓ ${m.correct}</div>
          <div class="mk-r">${m.rule}</div>
        </div>`).join('')}
    </div>`:'';
  return `<div class="card"><div class="result">
    <div style="font-size:42px">${emoji}</div>
    <div style="font-size:24px;margin:4px 0">${stars}</div>
    <div class="big" style="color:${C[ct.id].c}">${score}/${total}</div>
    <div class="msg">${msg}</div>
    <div class="result-btns">
      <button class="btn btn-sec" onclick="setTab('theory')">📖 Teoria</button>
      <button class="btn btn-sec" onclick="setTab('formulas')">📋 Fakty</button>
      <button class="btn btn-pri" onclick="setTab('quiz')">Ponownie ↺</button>
    </div>
    ${mHTML}
  </div></div>`;
}

function choose(i){
  if(sel!==null)return;
  sel=i;
  const q=qList[qi];
  if(i===q.a)score++;
  else mistakes.push({q:q.q,wrong:q.opts[i],correct:q.opts[q.a],rule:q.expl});
  render();
}
function nextQ(){qi++;sel=null;render();}

function render(){
  const c=document.getElementById('content');
  if(tab==='theory')c.innerHTML=renderTheory();
  else if(tab==='formulas')c.innerHTML=renderFormulas();
  else if(tab==='examples')c.innerHTML=renderExamples();
  else if(tab==='flash')c.innerHTML=renderFlash();
  else c.innerHTML=renderQuiz();
}

setTopic('t1');
</script>
<script src="nav.js"></script>
</body>
</html>
